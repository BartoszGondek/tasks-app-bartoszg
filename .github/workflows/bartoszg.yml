name: python workflow

on: 
  push:
    branches: [main]
  pull_request: 
    branches: [main]

permissions:
  contents: read 

jobs: 
  test:
      runs-on: ubuntu-latest
      strategy:
        matrix:
          service: [tasks-api, title-normalizer]

      steps:
        - name: Checkout repository
          uses: actions/checkout@v6

        - name: Set up Python
          uses: actions/setup-python@v5
          with: 
            python-version: "3.12" 

        - name: Install dependecies
           
          run: pip install -r services/${{ matrix.service }}/requirements.txt
          run: pytest services/${{ matrix.service }}

        

        