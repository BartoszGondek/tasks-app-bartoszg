name: python workflow

on: 
  push:
    branches: [main]
  pull_request: 
    branches: [main]

permissions:
  contents: read 

jobs: 
  test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v6

        - name: Set up Python
          uses: actions/setup-python@v5
          with: 
            python-version: "3.12" 

        - name: Install dependecies 
          run: | 
            python -m pip install -r /workspaces/tasks-app-bartoszg/services/tasks-api/requirements.txt
            python -m pip install --upgrade pip 
            python -m pip install pytest 

        - name: Run tests 
          run: pytest 