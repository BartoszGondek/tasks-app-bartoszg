name: python workflow

on: 
  push:
    branches: [main]
  pull_request: 
    branches: [main]

permissions:
  contents: read 

jobs: 
  test:
      runs-on: ubuntu-latest
      strategy:
        matrix:
          service: [tasks-api, title-normalizer]

      steps:
        - name: Checkout repository
          uses: actions/checkout@v6

        - name: Set up Python
          uses: actions/setup-python@v5
          with: 
            python-version: "3.12" 

        - name: Install dependecies
          run: pip install -r services/${{ matrix.service }}/requirements.txt
        - name: Run tests 
          run: pytest services/${{ matrix.service }}
        - shell: bash 
          run: pytest -rA services/${{ matrix.service }} | tee ${{matrix.service}}-test-report.txt
        - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.service }}-test-report
          path: ${{ matrix.service }}-test-report.txt

        

        